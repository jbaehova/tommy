name: iOS

# Checks that the iPhone app still builds for the simulator, without signing. It runs only when the
# native iPhone parts change, beside CI, and it blocks nothing. A build for a phone needs the signing
# team of its owner; see docs/INSTALL.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/app.config.js"
      - "apps/mobile/package.json"
      - "apps/mobile/modules/*/ios/**"
      - "apps/mobile/modules/*/expo-module.config.json"
      - "apps/mobile/plugins/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate the native project
        run: bun run mobile:ios:prebuild
      - name: Restore pods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ios-pods-${{ hashFiles('bun.lock', 'apps/mobile/modules/*/ios/*.podspec') }}
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build
        working-directory: apps/mobile/ios
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild \
            -workspace Tommy.xcworkspace \
            -scheme Tommy \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build >"$log" 2>&1; then
            grep -E "error:" -A4 "$log" | head -200
            tail -40 "$log"
            exit 1
          fi
          grep -E "\*\* BUILD" "$log"
