name: Release

# A tag `v<version>` (the version in package.json) builds the unpacked Linux server for x64 and arm64
# and publishes them as a GitHub release. A manual run builds the same files as workflow artifacts
# only. See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        name: Read and check the version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag $GITHUB_REF_NAME does not match package.json $version." >&2; exit 1; }
            git fetch --quiet origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tagged commit is not on main." >&2; exit 1; }
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    name: Linux server (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          bun run build
          bun x electron-builder --dir --linux "--${{ matrix.arch }}" --publish never
          folder=dist/linux-unpacked
          [[ "${{ matrix.arch }}" == arm64 ]] && folder=dist/linux-arm64-unpacked
          test -x "$folder/tommy"
          test -x "$folder/chrome-sandbox"
          test -s "$folder/resources/app.asar.unpacked/out/main/agent-database-host.js"
          test -s "$folder/resources/app.asar.unpacked/node_modules/effect/dist/index.js"
          test -x "$folder/resources/hosting/tommy-install"
          test -x "$folder/resources/agent-desktop/agent-desktop"
          cmp .tommy-build/agent-desktop/agent-desktop "$folder/resources/agent-desktop/agent-desktop"
          name="Tommy-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
          mv "$folder" "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs: [version, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [${{ needs.version.outputs.version }}]" '
            $0 == heading { active = 1; found = 1; next }
            active && /^## / { exit }
            active { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$release_notes"
          [[ -s "$release_notes" ]] || { echo "Release notes are missing." >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "Tommy ${{ needs.version.outputs.version }}" \
            --notes-file "$release_notes" --verify-tag
