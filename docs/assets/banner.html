<!doctype html>
<!-- Source of banner.png (README) and site/og.png. Render it with a headless browser at 1040x420 for
the banner, or at 1200x630 for the link preview, both with a device scale factor of 2. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tommy banner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 2vh 0 5vh;
        color: #33383f;
        font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
      }

      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 1.84em;
        overflow: hidden;
        font-size: min(27vw, 40vh);
        font-weight: 700;
        line-height: 0.82;
        letter-spacing: -0.065em;
      }

      .stage span {
        display: block;
        flex: none;
        padding-right: 0.06em;
      }

      .ghost {
        height: 0.82em;
        color: transparent;
        -webkit-text-stroke: 2px #e3e7ec;
      }

      .ghost.top {
        margin-top: -0.4em;
      }

      .word {
        height: 1.02em;
        padding-top: 0.04em;
        color: #3570ad;
      }

      .wrap {
        position: relative;
      }

      .cursor {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font: 600 15px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      .cursor svg {
        width: 20px;
        height: 20px;
        margin: 0 0 -2px -6px;
        fill: currentColor;
        stroke: #fff;
        stroke-width: 1.4;
        stroke-linejoin: round;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: 8px;
        padding: 4px 13px 4px 4px;
        border-radius: 999px;
        box-shadow: 0 8px 18px -8px rgb(0 0 0 / 0.4);
        color: #fff;
        white-space: nowrap;
      }

      .tag img {
        width: 26px;
        height: 26px;
        border: 2px solid #fff;
        border-radius: 50%;
      }

      .tag.plain {
        padding-left: 13px;
        height: 34px;
      }

      .c1 {
        top: 12%;
        left: -14%;
        color: #e0663d;
      }

      .c1 .tag {
        background: #e0663d;
      }

      .c2 {
        top: 4%;
        right: -16%;
        color: #2f3540;
      }

      .c2 .tag {
        background: #2f3540;
      }

      .c3 {
        bottom: 6%;
        left: -6%;
        color: #2f9467;
      }

      .c3 .tag {
        background: #2f9467;
      }

      .c4 {
        right: -19%;
        bottom: 24%;
        color: #3570ad;
      }

      .c4 .tag {
        background: #3570ad;
      }

      .line {
        margin: 0.4em 0 0;
        font-size: min(4.2vw, 7.6vh);
        font-weight: 700;
        letter-spacing: -0.045em;
      }

      .line span {
        color: #3570ad;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="stage">
        <span class="ghost top">tommy</span>
        <span class="word">tommy</span>
        <span class="ghost">tommy</span>
      </div>
      <span class="cursor c1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 19 10l-6.2 1.8L10 18z" /></svg>
        <span class="tag"><img src="../../site/avatars/travel.jpg" alt="" />Travel Planner</span>
      </span>
      <span class="cursor c2">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 19 10l-6.2 1.8L10 18z" /></svg>
        <span class="tag"><img src="../../site/avatars/engineer.jpg" alt="" />Engineer</span>
      </span>
      <span class="cursor c3">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 19 10l-6.2 1.8L10 18z" /></svg>
        <span class="tag"><img src="../../site/avatars/finance.jpg" alt="" />Finance</span>
      </span>
      <span class="cursor c4">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 19 10l-6.2 1.8L10 18z" /></svg>
        <span class="tag"><img src="../../site/avatars/designer.jpg" alt="" />Designer</span>
      </span>
    </div>
    <p class="line">Your AI team. <span>In Telegram.</span></p>
  </body>
</html>
