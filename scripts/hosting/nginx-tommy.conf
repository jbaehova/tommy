# The public entry of a Tommy server. Replace tommy.example.com with the server's name and
# install this file in /etc/nginx/sites-available. Nginx holds TLS and forwards only the three
# direct connection paths to loopback. The Team API stays on loopback and has no public path.

limit_req_zone $binary_remote_addr zone=tommy_pair:1m rate=10r/m;

map $http_upgrade $tommy_connection {
    default upgrade;
    "" "";
}

server {
    listen 80;
    listen [::]:80;
    server_name tommy.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tommy-acme;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tommy.example.com;
    ssl_certificate /etc/letsencrypt/live/tommy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tommy.example.com/privkey.pem;
    ssl_protocols TLSv1.3;
    server_tokens off;
    # The URLs hold a device ID and a files token.
    access_log off;
    client_max_body_size 16k;

    location = /tommy/v1/pair {
        limit_req zone=tommy_pair burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/tommy/v1/(connect|files)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tommy_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        # The gateway pings each socket every 15 seconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / { return 404; }
}
