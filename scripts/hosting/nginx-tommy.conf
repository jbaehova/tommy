# The public entry of a Tommy server. Replace tommy.example.com with the server's name and
# install this file in /etc/nginx/sites-available. Nginx terminates TLS and forwards the Telegram
# interface and the signed webhooks to the loopback listener of Tommy.

# Public webhook senders. A signature check runs for each request, so one address gets a bounded rate.
limit_req_zone $binary_remote_addr zone=tommy_hooks:1m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tommy.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tommy-acme;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tommy.example.com;
    ssl_certificate /etc/letsencrypt/live/tommy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tommy.example.com/privkey.pem;
    ssl_protocols TLSv1.3;
    server_tokens off;
    # The Mini App requests carry Telegram launch data.
    access_log off;
    client_max_body_size 16k;

    location ~ ^/tommy/telegram/update/[1-9][0-9]*$ {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        limit_req zone=tommy_hooks burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/tommy/telegram/app(/state|/secret|/preview|/answer)?$ {
        client_max_body_size 32k;
        client_body_buffer_size 32k;
        limit_req zone=tommy_hooks burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Tommy returns 404 unless TOMMY_WEBHOOK_PUBLIC_URL is configured.
    # Each receiver validates its own signature before accepting the original body.
    location ^~ /hooks/ {
        client_max_body_size 1m;
        limit_req zone=tommy_hooks burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / { return 404; }
}
