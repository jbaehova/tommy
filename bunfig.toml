[install]
exact = true
linker = "hoisted"
# Do not resolve a version that is less than 3 days old (259200 seconds). Most
# malicious releases are found and removed from the registry in that time.
minimumReleaseAge = 259200
# Effect 4.0.0 is explicitly approved for this migration before the age limit.
minimumReleaseAgeExcludes = ["effect"]
